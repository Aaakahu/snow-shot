name: Build Snow Shot (mouse markdown action)

on:
  workflow_dispatch:
    inputs:
      rebuild_qt:
        description: Rebuild static Qt (slow). Off = reuse the artifact from qt_run_id.
        type: boolean
        default: false
      qt_run_id:
        description: Workflow run that holds the qt6-static artifact
        type: string
        default: "45126146659"

permissions:
  contents: read

jobs:
  qt:
    if: ${{ inputs.rebuild_qt }}
    runs-on: windows-2025-vs2026
    timeout-minutes: 350
    env:
      VCPKG_BINARY_SOURCES: clear;x-gha,readwrite
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Bootstrap vcpkg (no deps)
        shell: pwsh
        run: pwsh -File scripts/bootstrap.ps1 -VcpkgVariants Static -SkipDependencyInstall -SkipQtValidation
      - name: Install zlib/libpng for Qt
        shell: pwsh
        run: |
          $repo = "${env:GITHUB_WORKSPACE}"
          . (Join-Path $repo "scripts/snow-build-environment.ps1")
          Add-SnowMsvcToolsToPath -Architecture x64 | Out-Null
          $overlays = @(Get-ChildItem "$repo/cmake/vcpkg-overlay-ports" -Directory |
              Where-Object { Test-Path "$($_.FullName)/portfile.cmake" } |
              ForEach-Object { "--overlay-ports=$($_.FullName)" })
          Push-Location $env:RUNNER_TEMP
          try {
              & "$repo/.tools/vcpkg/vcpkg.exe" install zlib libpng `
                  --triplet x64-windows-static --host-triplet x64-windows `
                  "--x-install-root=$repo/.tools/vcpkg/installed/static" `
                  @overlays `
                  "--overlay-triplets=$repo/cmake/vcpkg-overlay-triplets" `
                  --disable-metrics
              if ($LASTEXITCODE -ne 0) { throw "vcpkg zlib/libpng install failed" }
          } finally { Pop-Location }
      - name: Build static Qt 6.12
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/snow-qt-6.12.0-x64" | Out-Null
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/qt-build-6.12.0-x64-static-system-codecs-no-timezone-locale-release" | Out-Null
          pwsh -File scripts/build-static-qt.ps1 -InstallPrefix D:/qt6-static -Parallelism 8
      - name: Compress Qt toolchain
        shell: pwsh
        run: Compress-Archive -Path D:/qt6-static -DestinationPath qt6-static.zip
      - name: Upload Qt toolchain
        uses: actions/upload-artifact@v4
        with:
          name: qt6-static
          path: qt6-static.zip
          if-no-files-found: error

  app:
    needs: qt
    if: ${{ needs.qt.result != 'failure' }}
    runs-on: windows-2025-vs2026
    timeout-minutes: 350
    env:
      VCPKG_BINARY_SOURCES: clear;x-gha,readwrite
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Install NSIS
        shell: pwsh
        run: choco install nsis -y --no-progress
      - name: Download Qt toolchain (built in this run)
        if: ${{ inputs.rebuild_qt }}
        uses: actions/download-artifact@v5
        with:
          name: qt6-static
          path: qt-download
      - name: Download Qt toolchain (from cached run)
        if: ${{ !inputs.rebuild_qt }}
        uses: actions/download-artifact@v5
        with:
          name: qt6-static
          path: qt-download
          run-id: ${{ inputs.qt_run_id }}
          github-token: ${{ github.token }}
      - name: Expand Qt toolchain
        shell: pwsh
        run: |
          Expand-Archive -Path qt-download/qt6-static.zip -DestinationPath D:/
          if (-not (Test-Path D:/qt6-static/lib/cmake/Qt6/Qt6Config.cmake)) { throw "Qt6Config.cmake missing" }
      - name: Package Snow Shot
        shell: pwsh
        env:
          SNOW_QT_STATIC_DIR: D:/qt6-static/lib/cmake/Qt6
        run: pwsh -File scripts/package-snow-shot.ps1 -Parallelism 8
      - name: Upload staged app
        uses: actions/upload-artifact@v4
        with:
          name: snow-shot-win64-mdmouse
          path: artifacts/snow-shot
          if-no-files-found: error
